name: Feature request
description: Suggest a capability or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you run into, not the solution yet.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: If it changes deck authoring, show the markdown or CLI call you have in mind.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Markdown syntax
        - '@mapre/core (parser and slide model)'
        - '@mapre/node (deck loading)'
        - '@mapre/runtime (browser runtime and presenter)'
        - '@mapre/cli (init, build, dev)'
        - Themes
        - Documentation
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Including what you do today as a workaround.
